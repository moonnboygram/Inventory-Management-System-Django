{% extends "invmanagementsys/base.html" %}
{% block content %}

<h2>Suppliers</h2>

<table class = "table table-striped">
    <thead>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Phone</th>
            <th>Email</th>  
            <th>Address</th>
        
        </tr>
    </thead>
    
    <tbody>
        {% for supplier in suppliers %}
        <tr>
           <td>{{ supplier.id }}</td>
           <td>{{ supplier.name }}</td>
           <td>{{ supplier.phone }}</td>
           <td>{{ supplier.email }}</td>
           <td>{{ supplier.address }}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
