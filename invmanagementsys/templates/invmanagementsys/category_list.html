{% extends "invmanagementsys/base.html" %}
{% block content %}

<h2>Categories</h2>

<table class = "table table-bordered">
    <thead>
        <tr>
            <th>ID</th>
            <th>Name</th>
            
        </tr>
    </thead>
    
    <tbody>
        {% for category in categories %}
        <tr>
           <td>{{ category.id }}</td>
           <td>{{ category.name }}</td>
           
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
